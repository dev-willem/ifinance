name: CI — Frontend

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'ifinance/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ifinance/**'

jobs:
  quality:
    name: Type-check, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('ifinance/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: ifinance
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile --config.only-built-dependencies=false

      - name: Type-check
        working-directory: ifinance
        run: pnpm type-check

      - name: Lint
        working-directory: ifinance
        run: pnpm lint

      - name: Unit tests
        working-directory: ifinance
        run: pnpm test

      - name: Build
        working-directory: ifinance
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL_STAGING || '' }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}

  # Deploy do frontend é feito pela integração nativa GitHub ↔ Vercel
  # (build e publicação automáticos a cada push em main) — ver DEPLOY.md.
